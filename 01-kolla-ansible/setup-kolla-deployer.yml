---
- hosts: localhost
  connection: local
  gather_facts: yes
  vars:
    # On force l'extraction du vrai utilisateur non-root pour éviter les pièges du become
    real_user: "{{ ansible_env.USER | default(ansible_user_id) }}"
    real_home: "{{ ansible_env.HOME }}"
    kolla_env_path: "{{ real_home }}/kolla-env"
    project_root: "/mnt/e/projet/openstack-private-cloud-iac"
    vagrant_lab_path: "{{ project_root }}/00-vagrant-lab"

  tasks:
    - name: "Étape 1 : Installer les dépendances système pour Kolla-Ansible"
      become: yes
      apt:
        name:
          - python3-dev
          - python3-pip
          - libffi-dev
          - gcc
          - libssl-dev
          - git
          - python3-venv
        state: present
        update_cache: yes

    - name: "Étape 2 : Créer l'environnement virtuel Python (kolla-env)"
      command: python3 -m venv "{{ kolla_env_path }}"
      args:
        creates: "{{ kolla_env_path }}"

    - name: "Mettre à jour pip dans le venv d'abord"
      pip:
        name: pip
        state: latest
        virtualenv: "{{ kolla_env_path }}"

    - name: "Installer les versions exactes d'Ansible et Kolla-Ansible (Caracal v19)"
      pip:
        name:
          - "ansible-core>=2.15,<2.17"
          - "kolla-ansible==19.1.0"  
        virtualenv: "{{ kolla_env_path }}"

    - name: "Étape 3 : Créer le répertoire de configuration /etc/kolla"
      become: yes
      file:
        path: /etc/kolla
        state: directory
        owner: "{{ real_user }}"
        group: "{{ real_user }}"
        mode: '0755'

    - name: "Copier les fichiers de configuration par défaut de Kolla"
      # On n'utilise PAS 'become: yes' ici pour que Ansible lise votre venv avec vos droits utilisateurs,
      # mais comme /etc/kolla vous appartient désormais (étape précédente), l'écriture fonctionnera.
      shell: |
        cp -r {{ kolla_env_path }}/share/kolla-ansible/etc_examples/kolla/* /etc/kolla/
      args:
        executable: /bin/bash
        creates: /etc/kolla/globals.yml

    - name: "Étape 4 : Générer les mots de passe par défaut (passwords.yml)"
      command: "{{ kolla_env_path }}/bin/kolla-genpwd"
      args:
        creates: /etc/kolla/passwords.yml
